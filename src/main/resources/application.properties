spring.application.name=event-delivery-engine

# H2 in-memory database (no disk persistence)
spring.datasource.url=jdbc:h2:mem:eventdelivery;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql on startup; do not let Hibernate manage DDL
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (optional, for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
